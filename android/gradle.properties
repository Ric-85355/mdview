# gradle.properties — created 2026-08-26, version 0.1.0.
# Purpose: keep the Android build deterministic and AndroidX-aware.
# Algorithm: configure Gradle JVM memory, AndroidX, and Kotlin code style.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
